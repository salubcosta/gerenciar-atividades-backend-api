<svg viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .box-sub   { font-size: 12.5px; fill: #475569; }
      .lbl       { font-size: 12px; fill: #334155; }
      .lbl-em    { font-size: 12px; fill: #1d4ed8; font-weight: 600; }
      .group-lbl { font-size: 13px; fill: #64748b; font-weight: 600; letter-spacing: .5px; }
    </style>
  </defs>

  <rect width="1000" height="630" fill="#f8fafc"/>

  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Arquitetura da Aplicação — Gerenciador de Atividades
  </text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">
    Cenário 1.1 — Front-end consome API própria, que integra com serviço externo (ViaCEP)
  </text>

  <!-- Usuário -->
  <g>
    <circle cx="90" cy="180" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="90" cy="170" r="9" fill="#94a3b8"/>
    <path d="M72 195 Q90 175 108 195 Z" fill="#94a3b8"/>
    <text x="90" y="226" text-anchor="middle" class="box-sub">Usuário</text>
    <text x="90" y="242" text-anchor="middle" class="box-sub">(navegador)</text>
  </g>

  <!-- Docker host boundary -->
  <rect x="170" y="90" width="560" height="340" rx="14" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="112" text-anchor="middle" class="group-lbl" fill="#0ea5e9">HOST DOCKER</text>

  <!-- Frontend container -->
  <rect x="200" y="140" width="220" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="200" y="140" width="220" height="30" rx="10" fill="#2563eb"/>
  <rect x="200" y="160" width="220" height="10" fill="#2563eb"/>
  <text x="310" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">CONTAINER · frontend</text>
  <text x="310" y="196" text-anchor="middle" class="box-title" font-size="15">React + Nginx</text>
  <text x="310" y="216" text-anchor="middle" class="box-sub">Interface do usuário</text>
  <text x="310" y="234" text-anchor="middle" class="box-sub">Servido via Nginx</text>
  <text x="310" y="266" text-anchor="middle" class="lbl-em">porta 3000</text>

  <!-- Backend container -->
  <rect x="500" y="140" width="220" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="500" y="140" width="220" height="30" rx="10" fill="#16a34a"/>
  <rect x="500" y="160" width="220" height="10" fill="#16a34a"/>
  <text x="610" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">CONTAINER · backend</text>
  <text x="610" y="196" text-anchor="middle" class="box-title" font-size="15">Flask REST API</text>
  <text x="610" y="216" text-anchor="middle" class="box-sub">Categorias · Projetos</text>
  <text x="610" y="234" text-anchor="middle" class="box-sub">Registros · Pessoas</text>
  <text x="610" y="266" text-anchor="middle" class="lbl-em">porta 5000</text>

  <!-- Volume / SQLite -->
  <g>
    <path d="M540 350 v40 a70 12 0 0 0 140 0 v-40" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <ellipse cx="610" cy="350" rx="70" ry="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="610" y="392" text-anchor="middle" class="box-sub" font-weight="600">SQLite</text>
    <text x="610" y="408" text-anchor="middle" class="box-sub">volume: atividades-data</text>
  </g>

  <!-- ViaCEP externo -->
  <rect x="780" y="150" width="185" height="120" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="872" y="180" text-anchor="middle" class="box-title" font-size="15">ViaCEP</text>
  <text x="872" y="200" text-anchor="middle" class="box-sub">API externa pública</text>
  <text x="872" y="216" text-anchor="middle" class="box-sub">(gratuita, sem chave)</text>
  <text x="872" y="240" text-anchor="middle" class="lbl">GET /ws/{cep}/json/</text>
  <text x="872" y="256" text-anchor="middle" class="group-lbl" font-size="11" fill="#a16207">fora do host Docker</text>

  <!-- Arrows -->
  <line x1="116" y1="182" x2="196" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="176" class="lbl">HTTP</text>

  <line x1="420" y1="215" x2="496" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="458" y="205" text-anchor="middle" class="lbl">REST / JSON</text>

  <line x1="610" y1="290" x2="610" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="318" class="lbl">persistência</text>

  <line x1="720" y1="205" x2="776" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="722" y="192" class="lbl">consulta CEP</text>

  <text x="450" y="450" text-anchor="middle" class="lbl-em">Métodos expostos pela API: GET · POST · PUT · DELETE</text>

  <!-- Sequência -->
  <text x="500" y="480" text-anchor="middle" class="group-lbl">FLUXO DA CONSULTA DE CEP</text>

  <g font-size="12.5" fill="#334155">
    <text x="85" y="518">Usuário informa o CEP na tela "Meus dados" do front-end</text>
    <text x="85" y="542">Front-end envia POST /pessoas para o back-end com o CEP informado</text>
    <text x="85" y="566">Back-end chama a API ViaCEP e recebe o JSON com logradouro, bairro, cidade e UF</text>
    <text x="85" y="590">Back-end trata os dados, grava no SQLite e devolve a pessoa completa ao front-end</text>
  </g>

  <circle cx="56" cy="514" r="10" fill="#dbeafe"/>
  <circle cx="56" cy="538" r="10" fill="#dbeafe"/>
  <circle cx="56" cy="562" r="10" fill="#dbeafe"/>
  <circle cx="56" cy="586" r="10" fill="#dbeafe"/>
  <text x="56" y="518" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">1</text>
  <text x="56" y="542" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">2</text>
  <text x="56" y="566" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">3</text>
  <text x="56" y="590" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">4</text>
</svg>
